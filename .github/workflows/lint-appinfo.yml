name: Lint appinfo

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  info-xml:
    name: Validate info.xml
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate XML
        run: |
          python3 -c "import xml.dom.minidom,sys; xml.dom.minidom.parse('appinfo/info.xml'); print('info.xml is valid XML')"

      - name: Check required fields
        run: |
          for field in id name summary description version licence author namespace; do
            if ! grep -q "<$field>" appinfo/info.xml; then
              echo "::error::Missing required field: $field"
              exit 1
            fi
          done
          echo "All required fields present"
