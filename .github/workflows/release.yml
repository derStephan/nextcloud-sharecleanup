name: Release

on:
  # Trigger when Tests workflow completes successfully on main/master
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main, master]
  # Also allow manual trigger
  workflow_dispatch:
    inputs:
      force:
        description: 'Force release even if no worthy commits found'
        required: false
        default: 'false'
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    # Only run if the Tests workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history for version calculation
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'

      - name: Get current version from info.xml
        id: current
        run: |
          CURRENT=$(grep -oP '(?<=<version>)[^<]+' appinfo/info.xml | head -1)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Current version: $CURRENT"

      - name: Determine next version
        id: next
        run: |
          # Analyze commits since last tag to determine bump type
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -z "$LAST_TAG" ]; then
            # No tags yet, start with current version
            NEXT="${{ steps.current.outputs.current }}"
          else
            # Check for breaking changes, features, or fixes
            BREAKING=$(git log ${LAST_TAG}..HEAD --grep="BREAKING CHANGE" --grep="!:" --oneline | wc -l)
            FEATURES=$(git log ${LAST_TAG}..HEAD --grep="^feat" --oneline | wc -l)
            FIXES=$(git log ${LAST_TAG}..HEAD --grep="^fix" --oneline | wc -l)
            
            IFS='.' read -r MAJOR MINOR PATCH <<< "${{ steps.current.outputs.current }}"
            
            if [ "$BREAKING" -gt 0 ]; then
              NEXT="$((MAJOR + 1)).0.0"
            elif [ "$FEATURES" -gt 0 ]; then
              NEXT="${MAJOR}.$((MINOR + 1)).0"
            elif [ "$FIXES" -gt 0 ]; then
              NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))"
            else
              # No relevant commits — check if we should release anyway
              if [ "${{ github.event.inputs.force }}" = "true" ] || \
                 [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                # Manual trigger or forced: release current version
                NEXT="${{ steps.current.outputs.current }}"
                echo "Manual/forced release of current version: $NEXT"
              else
                # Check if info.xml was modified in the last commit
                INFO_CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -c "appinfo/info.xml" || echo "0")
                if [ "$INFO_CHANGED" -gt 0 ]; then
                  NEXT="${{ steps.current.outputs.current }}"
                  echo "info.xml changed, releasing current version: $NEXT"
                else
                  echo "skip=true" >> "$GITHUB_OUTPUT"
                  echo "No release-worthy commits found"
                  exit 0
                fi
              fi
            fi
          fi
          
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Next version: $NEXT"

      - name: Skip if no release needed
        if: ${{ steps.next.outputs.skip == 'true' }}
        run: echo "No release needed — exiting"

      - name: Update version in info.xml
        if: ${{ steps.next.outputs.skip != 'true' }}
        run: |
          NEXT="${{ steps.next.outputs.next }}"
          sed -i "s/<version>.*<\/version>/<version>$NEXT<\/version>/" appinfo/info.xml
          grep '<version>' appinfo/info.xml

      - name: Update README.md with new version
        if: ${{ steps.next.outputs.skip != 'true' }}
        run: |
          NEXT="${{ steps.next.outputs.next }}"
          # Update install command with new version
          sed -i "s/sharecleanup-[0-9]*\.[0-9]*\.[0-9]*\.tar\.gz/sharecleanup-$NEXT.tar.gz/" README.md
          echo "=== README updated ==="
          grep -n "sharecleanup-.*tar.gz" README.md

      - name: Build tarball
        if: ${{ steps.next.outputs.skip != 'true' }}
        run: |
          APP_ID=$(grep -oP '(?<=<id>)[^<]+' appinfo/info.xml | head -1)
          VERSION="${{ steps.next.outputs.next }}"
          ARCHIVE="${APP_ID}-${VERSION}.tar.gz"

          mkdir -p "/tmp/${APP_ID}"
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='tests' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='phpunit.xml' \
            --exclude='.tx' \
            ./ "/tmp/${APP_ID}/"

          tar -czf "$ARCHIVE" -C /tmp "$APP_ID"
          echo "archive=$ARCHIVE" >> "$GITHUB_ENV"
          echo "Built $ARCHIVE"

      - name: Commit version bump
        if: ${{ steps.next.outputs.skip != 'true' }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add appinfo/info.xml README.md
          git commit -m "chore(release): ${{ steps.next.outputs.next }} [skip ci]" || echo "No changes to commit"
          git push

      - name: Create tag
        if: ${{ steps.next.outputs.skip != 'true' }}
        run: |
          NEXT="${{ steps.next.outputs.next }}"
          git tag -a "v$NEXT" -m "Release v$NEXT"
          git push origin "v$NEXT"

      - name: Create GitHub Release
        if: ${{ steps.next.outputs.skip != 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.next.outputs.next }}
          name: v${{ steps.next.outputs.next }}
          files: ${{ env.archive }}
          generate_release_notes: true
          draft: false
          prerelease: false
