name: Release

on:
  # Only trigger on pushes to main/master that change version
  push:
    branches: [main, master]
  # Also allow manual trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # First: run tests to ensure everything is green
  test:
    name: Run tests
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  # Then: only release if tests passed
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    needs: test
    # Only run if tests succeeded
    if: ${{ needs.test.result == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history for version calculation
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'

      - name: Get current version from info.xml
        id: current
        run: |
          CURRENT=$(grep -oP '(?<=<version>)[^<]+' appinfo/info.xml | head -1)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Current version: $CURRENT"

      - name: Determine next version
        id: next
        run: |
          # Analyze commits since last tag to determine bump type
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -z "$LAST_TAG" ]; then
            # No tags yet, start with current version
            NEXT="${{ steps.current.outputs.current }}"
          else
            # Check for breaking changes, features, or fixes
            BREAKING=$(git log ${LAST_TAG}..HEAD --grep="BREAKING CHANGE" --grep="!:" --oneline | wc -l)
            FEATURES=$(git log ${LAST_TAG}..HEAD --grep="^feat" --oneline | wc -l)
            FIXES=$(git log ${LAST_TAG}..HEAD --grep="^fix" --oneline | wc -l)
            
            IFS='.' read -r MAJOR MINOR PATCH <<< "${{ steps.current.outputs.current }}"
            
            if [ "$BREAKING" -gt 0 ]; then
              NEXT="$((MAJOR + 1)).0.0"
            elif [ "$FEATURES" -gt 0 ]; then
              NEXT="${MAJOR}.$((MINOR + 1)).0"
            elif [ "$FIXES" -gt 0 ]; then
              NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))"
            else
              # No relevant commits, skip release
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "No release-worthy commits found"
              exit 0
            fi
          fi
          
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Next version: $NEXT"

      - name: Skip if no release needed
        if: ${{ steps.next.outputs.skip == 'true' }}
        run: echo "No release needed — exiting"

      - name: Update version in info.xml
        if: ${{ steps.next.outputs.skip != 'true' }}
        run: |
          NEXT="${{ steps.next.outputs.next }}"
          sed -i "s/<version>.*<\/version>/<version>$NEXT<\/version>/" appinfo/info.xml
          grep '<version>' appinfo/info.xml

      - name: Build tarball
        if: ${{ steps.next.outputs.skip != 'true' }}
        run: |
          APP_ID=$(grep -oP '(?<=<id>)[^<]+' appinfo/info.xml | head -1)
          VERSION="${{ steps.next.outputs.next }}"
          ARCHIVE="${APP_ID}-${VERSION}.tar.gz"

          mkdir -p "/tmp/${APP_ID}"
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='tests' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='phpunit.xml' \
            --exclude='.tx' \
            ./ "/tmp/${APP_ID}/"

          tar -czf "$ARCHIVE" -C /tmp "$APP_ID"
          echo "archive=$ARCHIVE" >> "$GITHUB_ENV"
          echo "Built $ARCHIVE"

      - name: Commit version bump
        if: ${{ steps.next.outputs.skip != 'true' }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add appinfo/info.xml
          git commit -m "chore(release): ${{ steps.next.outputs.next }} [skip ci]" || echo "No changes to commit"
          git push

      - name: Create tag
        if: ${{ steps.next.outputs.skip != 'true' }}
        run: |
          NEXT="${{ steps.next.outputs.next }}"
          git tag -a "v$NEXT" -m "Release v$NEXT"
          git push origin "v$NEXT"

      - name: Create GitHub Release
        if: ${{ steps.next.outputs.skip != 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.next.outputs.next }}
          name: v${{ steps.next.outputs.next }}
          files: ${{ env.archive }}
          generate_release_notes: true
          draft: false
          prerelease: false
