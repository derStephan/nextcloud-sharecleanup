name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Allow this workflow to be called by other workflows (e.g. release.yml)
  workflow_call:
  # Trigger when a new Nextcloud major version is released
  # (detected by the bump-nextcloud workflow creating a PR)
  workflow_run:
    workflows: ["Bump Nextcloud max-version"]
    types: [completed]

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: tests-${{ github.ref }}
  # Only cancel on PRs, not on main — main runs must complete
  # so that bump-nextcloud can react to green tests
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ------------------------------------------------------------------
  # 1. PHP syntax lint across all supported PHP versions
  # ------------------------------------------------------------------
  lint:
    name: PHP ${{ matrix.php }} lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint all PHP files
        run: |
          set -e
          find lib templates appinfo tests -name '*.php' -print0 \
            | xargs -0 -n1 php -l > /dev/null
          echo "All PHP files passed syntax check."

  # ------------------------------------------------------------------
  # 2. PHPUnit unit tests (standalone, with OCP stubs)
  # ------------------------------------------------------------------
  phpunit:
    name: PHPUnit PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run unit tests
        run: vendor/bin/phpunit --colors=always

  # ------------------------------------------------------------------
  # 3. Code coverage (single PHP version, uploads to Codecov)
  # ------------------------------------------------------------------
  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    needs: lint
    # Only run on push to main/master, not on PRs (saves resources)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP with PCOV
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: pcov
          ini-values: pcov.directory=lib

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run tests with coverage
        run: vendor/bin/phpunit --coverage-clover=coverage.xml --colors=always

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ------------------------------------------------------------------
  # 4. PHPUnit against real Nextcloud (integration)
  #    Only runs when triggered by a new Nextcloud major version
  #    (via workflow_run from bump-nextcloud.yml) or manually.
  # ------------------------------------------------------------------
  integration:
    name: NC ${{ matrix.nextcloud }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    needs: lint
    # Run on workflow_dispatch, or on push to main when tests.yml was modified
    # (e.g. by bump-nextcloud updating the matrix)
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    strategy:
      fail-fast: false
      matrix:
        # Test against the latest stable Nextcloud release, not master
        nextcloud: ['stable33', 'stable34']
        php: ['8.2']

    steps:
      - name: Checkout Nextcloud server
        uses: actions/checkout@v5
        with:
          repository: nextcloud/server
          ref: ${{ matrix.nextcloud }}
          path: nextcloud

      - name: Checkout this app into apps/sharecleanup
        uses: actions/checkout@v5
        with:
          path: nextcloud/apps/sharecleanup

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install app dependencies
        working-directory: nextcloud/apps/sharecleanup
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run unit tests against real OCP
        working-directory: nextcloud/apps/sharecleanup
        run: vendor/bin/phpunit --colors=always
