name: Bump Nextcloud max-version

on:
  # Runs after the Tests workflow completes on the default branch
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main, master]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    name: Bump max-version if tests passed
    # Only run when the Tests workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Get latest Nextcloud major version
        id: nc
        run: |
          LATEST=$(curl -s https://api.github.com/repos/nextcloud/server/releases/latest \
            | grep -oP '"tag_name":\s*"v?\K+' | head -1)

          if [ -z "$LATEST" ]; then
            echo "::warning::Could not determine latest Nextcloud version — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest Nextcloud major: $LATEST"

      - name: Check current max-version
        id: current
        run: |
          CURRENT=$(grep -oP '(?<=max-version=")+' appinfo/info.xml | head -1)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Current max-version: $CURRENT"

      - name: Skip if already up to date
        if: ${{ steps.current.outputs.current >= steps.nc.outputs.latest }}
        run: echo "max-version is already ${{ steps.current.outputs.current }} — nothing to do"

      - name: Bump max-version
        if: ${{ steps.current.outputs.current < steps.nc.outputs.latest }}
        run: |
          LATEST="${{ steps.nc.outputs.latest }}"
          sed -i "s/max-version=\"*\"/max-version=\"$LATEST\"/" appinfo/info.xml
          grep 'max-version' appinfo/info.xml

      - name: Create Pull Request
        if: ${{ steps.current.outputs.current < steps.nc.outputs.latest }}
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: bump Nextcloud max-version to ${{ steps.nc.outputs.latest }}"
          title: "chore: support Nextcloud ${{ steps.nc.outputs.latest }}"
          body: |
            The [Tests workflow](${{ github.event.workflow_run.html_url }}) passed against the latest Nextcloud master.

            This PR bumps `max-version` in `appinfo/info.xml` from **${{ steps.current.outputs.current }}** to **${{ steps.nc.outputs.latest }}**.

            _Auto-generated by the bump-nextcloud workflow._
          branch: chore/bump-nextcloud-max-version
          delete-branch: true
          labels: dependencies
