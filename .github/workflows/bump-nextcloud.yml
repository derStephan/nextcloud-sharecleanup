name: Bump Nextcloud max-version

on:
  # Schedule: check weekly for new Nextcloud releases
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  # Also trigger manually
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    name: Auto-bump max-version
    runs-on: ubuntu-latest
    # Only run on schedule or manual dispatch

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest Nextcloud major version
        id: nc
        run: |
          # Get all releases and find the highest major version
          LATEST=$(curl -s "https://api.github.com/repos/nextcloud/server/releases?per_page=100" \
            | grep -oP '"tag_name":\s*"v?\K+' \
            | sort -n \
            | tail -1)

          if [ -z "$LATEST" ]; then
            echo "::warning::Could not determine latest Nextcloud version — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest Nextcloud major: $LATEST"

      - name: Check current max-version
        id: current
        run: |
          CURRENT=$(grep -oP '(?<=max-version=")+' appinfo/info.xml | head -1)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Current max-version: $CURRENT"

      - name: Skip if already up to date
        if: ${{ steps.current.outputs.current >= steps.nc.outputs.latest }}
        run: echo "max-version is already ${{ steps.current.outputs.current }} — nothing to do"

      - name: Check if major version jump
        id: jump
        run: |
          CURRENT="${{ steps.current.outputs.current }}"
          LATEST="${{ steps.nc.outputs.latest }}"
          DIFF=$((LATEST - CURRENT))
          
          if [ "$DIFF" -ge 1 ]; then
            echo "is_major_jump=true" >> "$GITHUB_OUTPUT"
            echo "Major version jump detected: $CURRENT → $LATEST (diff: $DIFF)"
          else
            echo "is_major_jump=false" >> "$GITHUB_OUTPUT"
            echo "No major jump (diff: $DIFF)"
          fi

      - name: Fetch supported PHP versions from Nextcloud docs
        id: php
        run: |
          python3 -c "
          import re, urllib.request, sys
          
          latest = '${{ steps.nc.outputs.latest }}'
          url = 'https://raw.githubusercontent.com/nextcloud/server/wiki/Releases-and-PHP-versions.md'
          
          try:
              with urllib.request.urlopen(url, timeout=30) as r:
                  content = r.read().decode('utf-8')
              
              # Find row for the NC version: | 34 | 8.2, 8.3, 8.4, 8.5 |
              pattern = r'\|\s*' + re.escape(latest) + r'\s*\|\s*([0-9.,\s]+)'
              match = re.search(pattern, content)
              
              if match:
                  versions = [v.strip() for v in match.group(1).split(',')]
                  versions = sorted(set(versions), key=lambda v: [int(x) for x in v.split('.')])
                  php_versions = ','.join(versions)
                  yaml_array = ', '.join(f"'{v}'" for v in versions)
                  print(f'php_versions={php_versions}')
                  print(f'yaml_array={yaml_array}')
              else:
                  raise ValueError(f'No PHP versions found for NC {latest}')
                  
          except Exception as e:
              print(f'::warning::Could not fetch PHP versions: {e}', file=sys.stderr)
              # Fallback: read from current tests.yml
              with open('.github/workflows/tests.yml') as f:
                  content = f.read()
              match = re.search(r"php: \[\K[^]]+", content)
              if match:
                  fallback = match.group(0)
                  print(f'php_versions={fallback.replace("'", "").replace(" ", "")}')
                  print(f'yaml_array={fallback}')
              else:
                  print('php_versions=8.2,8.3,8.4,8.5')
                  print('yaml_array=\'8.2\', \'8.3\', \'8.4\', \'8.5\'')
          " >> "$GITHUB_OUTPUT"
          
          cat "$GITHUB_OUTPUT"

      - name: Bump max-version, test matrix, PHP versions, then commit
        if: ${{ steps.jump.outputs.is_major_jump == 'true' }}
        run: |
          LATEST="${{ steps.nc.outputs.latest }}"
          PREVIOUS=$((LATEST - 1))
          PHP_YAML="${{ steps.php.outputs.yaml_array }}"
          PHP_READABLE="${{ steps.php.outputs.php_versions }}"
          
          # 1) Update info.xml max-version
          sed -i "s/max-version=\"*\"/max-version=\"$LATEST\"/" appinfo/info.xml
          echo "=== info.xml ==="
          grep 'max-version' appinfo/info.xml
          
          # 2) Update tests.yml:
          #    a) Integration matrix: previous + latest NC version
          NEW_MATRIX="'stable$PREVIOUS', 'stable$LATEST'"
          sed -i "s/nextcloud: \[[^]]*\]/nextcloud: [$NEW_MATRIX]/" .github/workflows/tests.yml
          
          #    b) PHP matrices: use versions supported by the new NC version
          sed -i "s/php: \[[^]]*\]/php: [$PHP_YAML]/g" .github/workflows/tests.yml
          
          echo "=== tests.yml updated ==="
          grep -n "nextcloud:\|php: \[" .github/workflows/tests.yml
          
          # 3) Update README.md with current versions
          APP_VERSION=$(grep -oP '(?<=<version>)[^<]+' appinfo/info.xml | head -1)
          NC_MIN=$(grep -oP '(?<=min-version=")[^"]+' appinfo/info.xml)
          NC_MATRIX=$(grep -oP "nextcloud: \[\K[^]]+" .github/workflows/tests.yml)
          
          # Convert PHP versions to readable range (e.g., 8.2–8.5)
          PHP_FIRST=$(echo "$PHP_READABLE" | cut -d',' -f1)
          PHP_LAST=$(echo "$PHP_READABLE" | tr ',' '\n' | tail -1)
          PHP_RANGE="$PHP_FIRST–$PHP_LAST"
          
          # Update install command version
          sed -i "s/sharecleanup-[0-9]*\.[0-9]*\.[0-9]*\.tar\.gz/sharecleanup-$APP_VERSION.tar.gz/" README.md
          
          # Update requirements line
          sed -i "s/Nextcloud [0-9]* or higher/Nextcloud $NC_MIN or higher/" README.md
          
          # Update PHP versions in CI section
          sed -i "s/PHP [0-9]*\.[0-9]*–[0-9]*\.[0-9]*/PHP $PHP_RANGE/" README.md
          
          # Update NC stable versions in CI section
          sed -i "s/(currently \`stable[0-9]*\` and \`stable[0-9]*\`)/(currently $NC_MATRIX)/" README.md
          
          echo "=== README updated ==="
          grep -n "sharecleanup-.*tar.gz\|Nextcloud.*or higher\|PHP.*–\|currently.*stable" README.md
          
          # 4) Commit and push
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add appinfo/info.xml .github/workflows/tests.yml README.md
          git commit -m "chore: bump NC max-version to $LATEST, PHP $PHP_RANGE, test matrix stable$PREVIOUS/stable$LATEST"
          git push origin HEAD:${{ github.ref_name }}
          
          echo "Successfully bumped to NC $LATEST with PHP $PHP_RANGE"

  release:
    name: Create release after bump
    runs-on: ubuntu-latest
    needs: bump
    if: ${{ needs.bump.result == 'success' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current version
        id: current
        run: |
          CURRENT=$(grep -oP '(?<=<version>)[^<]+' appinfo/info.xml | head -1)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Current version: $CURRENT"

      - name: Build tarball
        run: |
          APP_ID=$(grep -oP '(?<=<id>)[^<]+' appinfo/info.xml | head -1)
          VERSION="${{ steps.current.outputs.current }}"
          ARCHIVE="${APP_ID}-${VERSION}.tar.gz"

          mkdir -p "/tmp/${APP_ID}"
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='tests' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='phpunit.xml' \
            --exclude='.tx' \
            ./ "/tmp/${APP_ID}/"

          tar -czf "$ARCHIVE" -C /tmp "$APP_ID"
          echo "archive=$ARCHIVE" >> "$GITHUB_ENV"
          echo "Built $ARCHIVE"

      - name: Create Git tag
        run: |
          VERSION="${{ steps.current.outputs.current }}"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.current.outputs.current }}
          name: v${{ steps.current.outputs.current }}
          body: |
            Automatic release after Nextcloud version bump.
            
            See commit history for details.
          files: ${{ env.archive }}
          token: ${{ secrets.GITHUB_TOKEN }}
