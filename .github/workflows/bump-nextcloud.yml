name: Bump Nextcloud max-version

on:
  # Schedule: check weekly for new Nextcloud releases
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  # Also trigger manually
  workflow_dispatch:
  # Trigger when Tests workflow completes successfully
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main, master]

permissions:
  contents: write

jobs:
  bump:
    name: Auto-bump max-version
    runs-on: ubuntu-latest
    # Only run on schedule, manual dispatch, or when Tests succeeded
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest Nextcloud major version
        id: nc
        run: |
          # Get all releases and find the highest major version
          LATEST=$(curl -s "https://api.github.com/repos/nextcloud/server/releases?per_page=100" \
            | grep -oP '"tag_name":\s*"v?\K+' \
            | sort -n \
            | tail -1)

          if [ -z "$LATEST" ]; then
            echo "::warning::Could not determine latest Nextcloud version — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest Nextcloud major: $LATEST"

      - name: Check current max-version
        id: current
        run: |
          CURRENT=$(grep -oP '(?<=max-version=")+' appinfo/info.xml | head -1)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Current max-version: $CURRENT"

      - name: Skip if already up to date
        if: ${{ steps.current.outputs.current >= steps.nc.outputs.latest }}
        run: echo "max-version is already ${{ steps.current.outputs.current }} — nothing to do"

      - name: Check if major version jump
        id: jump
        run: |
          CURRENT="${{ steps.current.outputs.current }}"
          LATEST="${{ steps.nc.outputs.latest }}"
          DIFF=$((LATEST - CURRENT))
          
          if [ "$DIFF" -ge 1 ]; then
            echo "is_major_jump=true" >> "$GITHUB_OUTPUT"
            echo "Major version jump detected: $CURRENT → $LATEST (diff: $DIFF)"
          else
            echo "is_major_jump=false" >> "$GITHUB_OUTPUT"
            echo "No major jump (diff: $DIFF)"
          fi

      - name: Bump max-version and commit
        if: ${{ steps.jump.outputs.is_major_jump == 'true' }}
        run: |
          LATEST="${{ steps.nc.outputs.latest }}"
          
          # Update info.xml
          sed -i "s/max-version=\"*\"/max-version=\"$LATEST\"/" appinfo/info.xml
          
          # Verify change
          grep 'max-version' appinfo/info.xml
          
          # Configure git
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Commit and push directly to main
          git add appinfo/info.xml
          git commit -m "chore: bump Nextcloud max-version to $LATEST [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
          
          echo "Successfully bumped max-version to $LATEST and pushed to ${{ github.ref_name }}"
